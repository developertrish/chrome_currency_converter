<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Currency Converter</title>
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
  <header>
    <h1>Currency Converter</h1>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="field">
    <label for="targetCurrency">Convert prices to</label>
    <select id="targetCurrency"></select>
  </section>

  <section class="field">
    <label for="displayMode">Display style</label>
    <select id="displayMode">
      <option value="badge">Show converted amount inline</option>
      <option value="tooltip">Underline original, show on hover</option>
    </select>
  </section>

  <footer>
    <p id="updated" class="muted"></p>
    <button id="refresh">Refresh rates</button>
  </footer>
</body>
</html>
